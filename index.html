<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luiz Carlos Porto — Software Engineer</title>
<meta name="description" content="Luiz Carlos Porto — dev .NET em Palmas, TO. Engenheiro de software da ESMAT/TJTO: sistema acadêmico, integrações com Moodle e TJTO em C# e SQL, e certificados com Vertex AI.">
<meta name="theme-color" content="#0E110F">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..800&family=Geist:wght@400;500;600&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/nav.css">
<link rel="stylesheet" href="assets/css/hero.css">
<link rel="stylesheet" href="assets/css/terminal.css">
<link rel="stylesheet" href="assets/css/palette.css">
<link rel="stylesheet" href="assets/css/sections.css">
<link rel="stylesheet" href="assets/css/sections/sobre.css">
<link rel="stylesheet" href="assets/css/sections/experiencia.css">
<link rel="stylesheet" href="assets/css/sections/projetos.css">
<link rel="stylesheet" href="assets/css/sections/stack.css">
<link rel="stylesheet" href="assets/css/sections/certificados.css">
<link rel="stylesheet" href="assets/css/sections/contato.css">

<script type="module" src="assets/js/main.js"></script>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#hero" data-i18n-attr="aria-label:nav.home" aria-label="Início"><span class="user">luiz</span><span class="host">@porto:~$</span><span class="cursor" aria-hidden="true"></span></a>
    <nav class="tabs" data-i18n-attr="aria-label:nav.sections" aria-label="Seções">
      <a class="tab" href="#sobre"><span class="dot" aria-hidden="true">●</span>sobre.md</a>
      <a class="tab" href="#experiencia"><span class="dot" aria-hidden="true">●</span>experiencia.log</a>
      <a class="tab" href="#projetos"><span class="dot" aria-hidden="true">●</span>projetos/</a>
      <a class="tab" href="#stack"><span class="dot" aria-hidden="true">●</span>stack.json</a>
      <a class="tab" href="#contato"><span class="dot" aria-hidden="true">●</span>contato.sh</a>
    </nav>
    <div class="nav-tools">
      <button class="search-btn" id="open-palette" type="button" aria-haspopup="dialog" aria-keyshortcuts="/" data-i18n-attr="aria-label:nav.openPalette" aria-label="Abrir paleta de comandos"><span class="label" data-i18n="nav.commands">comandos</span><kbd>/</kbd></button>
      <button class="lang" id="lang-btn" type="button" data-i18n-attr="aria-label:nav.lang,title:nav.lang" aria-label="Idioma: português. Mudar para inglês">PT</button>
    </div>
  </div>
</header>

<main>

  <!-- HERO -->
  <section class="hero" id="hero" aria-labelledby="hero-name">
    <div class="wrap">
      <div class="hero-copy">
        <p class="status"><span class="pulse" aria-hidden="true"></span><span data-content="status"></span></p>
        <!-- o nome vem do content.js; o texto abaixo só aparece se o JS não carregar -->
        <h1 class="name" id="hero-name">Luiz Carlos Porto</h1>
        <p class="lede" data-content="lede"></p>
        <div class="ctas">
          <a class="btn primary" href="#projetos">cd ~/projetos <span class="arrow" aria-hidden="true">→</span></a>
          <a class="btn" data-link="github" target="_blank" rel="noopener">GitHub <span aria-hidden="true">↗</span></a>
          <a class="btn" data-link="linkedin" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
        </div>
        <p class="meta">
          <span><span data-i18n="hero.local">local</span> <b><span data-content="city"></span> · <time id="clock">--:--</time></b></span>
          <span><span data-i18n="hero.uptime">uptime no TJTO</span> <b id="uptime">--</b></span>
          <span>TCC <b data-content="tcc.grade"></b></span>
        </p>
      </div>

      <div class="term" id="term" role="region" data-i18n-attr="aria-label:term.title" aria-label="Terminal interativo">
        <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i><span>~/luiz — zsh</span></div>
        <div class="term-body" id="term-out" role="log" aria-live="polite" tabindex="0" data-i18n-attr="aria-label:term.output" aria-label="Saída do terminal"></div>
        <form class="term-input" id="term-form" autocomplete="off">
          <label for="term-cmd">➜ ~</label>
          <input id="term-cmd" type="text" spellcheck="false" autocapitalize="off" enterkeyhint="send"
                 data-i18n-attr="placeholder:term.placeholder,aria-label:term.input" placeholder="digite help" aria-label="Comando do terminal">
        </form>
      </div>
    </div>
  </section>

  <!-- seções em sections/*.html, carregadas por assets/js/sections.js -->
  <div data-include="sections/sobre.html"></div>
  <div data-include="sections/experiencia.html"></div>
  <div data-include="sections/projetos.html"></div>
  <div data-include="sections/stack.html"></div>
  <div data-include="sections/certificados.html"></div>
  <div data-include="sections/contato.html"></div>

</main>

<noscript>
  <p class="noscript">Este site precisa de JavaScript para carregar as seções. Currículo em PDF: <a href="curriculo-luiz-porto.pdf">curriculo-luiz-porto.pdf</a></p>
</noscript>

<footer class="site-footer">
  <span data-i18n="footer">© 2026 Luiz Carlos Porto do Carmo.</span>
</footer>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" data-i18n-attr="aria-label:pal.label" aria-label="Paleta de comandos">
    <input id="palette-input" type="text" role="combobox" aria-expanded="false" aria-controls="palette-list" aria-autocomplete="list"
           autocomplete="off" spellcheck="false"
           data-i18n-attr="placeholder:pal.placeholder,aria-label:pal.search" placeholder="para onde? (ex.: projetos, github, café)" aria-label="Buscar comando">
    <ul id="palette-list" role="listbox" data-i18n-attr="aria-label:pal.label" aria-label="Paleta de comandos"></ul>
    <div class="palette-foot" aria-hidden="true">
      <span><kbd>↑</kbd> <kbd>↓</kbd> <span data-i18n="pal.nav">navegar</span></span>
      <span><kbd>enter</kbd> <span data-i18n="pal.open">abrir</span></span>
      <span><kbd>esc</kbd> <span data-i18n="pal.close">fechar</span></span>
    </div>
  </div>
</div>
<div class="toast" id="toast" aria-hidden="true" hidden></div>
<div class="sr-only" id="sr-status" role="status"></div>

</body>
</html>
